# syntax = docker-registry.wikimedia.org/repos/releng/blubber/buildkit:v1.9
version: v4
base: docker-registry.wikimedia.org/trixie:20261018

variants:
  sh-local:
    copies: [local]
    entrypoint:
      - bash
      - -c

  sequence:
    entrypoint: [seq]
  arithmetic:
    entrypoint:
      - bash
      - -c
      - |-
        for expr in "$@"; do
          echo $(($expr))
        done
      - --

  service1-checkexcludes:
    copies: [local]
    entrypoint: [./checkexcludes.sh]
  echo:
    entrypoint: [/bin/echo, -e]
  bash:
    entrypoint: [/bin/bash, -c]
  php2shell:
    base: docker-registry.wikimedia.org/php8.5-cli:8.5.9-2-20261018
