# syntax = docker-registry.wikimedia.org/repos/releng/blubber/buildkit:v1.9
version: v4
base: docker-registry.wikimedia.org/trixie:20261018
apt: { packages: [make] }

variants:
  test:
    copies: [local]
    entrypoint: [make, unit]
  lint:
    copies: [local]
    entrypoint: [make, lint]
  production:
    copies: [local]
    apt: { packages: [netcat-traditional] }
    entrypoint: [./server.sh]
